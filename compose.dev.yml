name: forever-healing-local
services:
  web:
    build:
      context: .
    image: forever-healing:local
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:${LOCAL_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    stop_grace_period: 15s
